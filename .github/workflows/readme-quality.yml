name: README Quality

on:
  pull_request:
    paths:
      - 'README.md'
      - 'README.zh-CN.md'
      - 'package.json'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'docker-compose*.yaml'
      - '.github/workflows/readme-quality.yml'
  push:
